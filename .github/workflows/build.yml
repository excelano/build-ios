name: build

run-name: build ${{ inputs.repo }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: The app's repository, owner/name
        required: true
      ref:
        description: The commit to build
        required: true
      version:
        description: The release version, for the .ipa's name
        required: true
      bundle_id:
        description: The App Store record's bundle id
        required: true
      project:
        description: The .xcodeproj, relative to the repository root
        required: true
      scheme:
        description: The scheme to archive
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-ios
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: app
      - uses: actions/setup-go@v5
        with:
          go-version-file: build-ios/go.mod
          cache: false
      - name: Keychain
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 24)
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          security find-certificate -c "Apple Distribution" -p "$kc" | openssl x509 -outform DER -out "$RUNNER_TEMP/dist.cer"
          security find-identity -v -p codesigning "$kc"
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8
      - name: Profiles
        working-directory: app
        env:
          PROJECT: ${{ inputs.project }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          xcodebuild -project "$PROJECT" -alltargets -configuration Release -showBuildSettings -json 2>/dev/null > "$RUNNER_TEMP/settings.json"
          (cd ../build-ios && go build -o "$RUNNER_TEMP/signing" ./signing)
          "$RUNNER_TEMP/signing" -bundle "$BUNDLE_ID" -cert "$RUNNER_TEMP/dist.cer" -settings "$RUNNER_TEMP/settings.json" \
            -key ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8 -key-id "${{ vars.ASC_KEY_ID }}" -issuer "${{ vars.ASC_ISSUER_ID }}" \
            -xcconfig "$RUNNER_TEMP/signing.xcconfig" -export-options "$RUNNER_TEMP/export.plist"
      - name: Archive
        working-directory: app
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          xcodebuild -version
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -destination generic/platform=iOS \
            -xcconfig "$RUNNER_TEMP/signing.xcconfig" -archivePath "$RUNNER_TEMP/archive.xcarchive" -quiet archive
      - name: Export
        env:
          VERSION: ${{ inputs.version }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/archive.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -quiet
          set -- "$RUNNER_TEMP/export"/*.ipa
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "the export wrote no single .ipa" >&2; exit 1; }
          mkdir "$RUNNER_TEMP/out"
          cp "$1" "$RUNNER_TEMP/out/$(basename "$1" .ipa)-$VERSION.ipa"
          ls -l "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect
